# Cloudflare Builds 静态站：仅上传 dist/，无 Worker 脚本。
# name 须与 Builds 项目 Worker Name 一致（当前为 docs-site）。
name = "docs-site"
compatibility_date = "2026-08-22"

# Source maps: remap uncaught exception stacks in Workers Logs / Tail (WW-26)
upload_source_maps = true

[assets]
directory = "./dist"

[observability]
enabled = true

[observability.traces]
enabled = true

# CF Workers Issues（WW-45）：平台归组异常/5xx/console.error（Wrangler ≥ 4.134.0）
# 勿只在 Dashboard Enable——下次 wrangler deploy 会关掉。Automations → Phase 2。
[observability.issues]
enabled = true
